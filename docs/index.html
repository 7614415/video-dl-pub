<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מכון להב מפיו יצא - הרב אבשלום שניידר</title>
<meta name="description" content="ארכיון שיעורי תורה מפי הרב אבשלום שניידר - ספר דעת תבונות לרמח&quot;ל, י&quot;ג עיקרי האמונה, אורחות צדיקים, ביטחון ועוד">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f1e;
    --bg-alt:#111730;
    --card:#161d38;
    --card-hover:#1c2444;
    --gold:#c4a45a;
    --gold-soft:#8a733d;
    --text:#eef0f6;
    --text-dim:#9aa2bd;
    --border:#25304f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Heebo',sans-serif;
    line-height:1.5;
  }
  a{color:inherit;text-decoration:none;}

  header{
    background:linear-gradient(180deg,var(--bg-alt),var(--bg));
    border-bottom:1px solid var(--border);
    padding:36px 20px 28px;
    text-align:center;
  }
  header .flame{
    font-size:34px;
    display:block;
    margin-bottom:6px;
    filter:drop-shadow(0 0 10px rgba(196,164,90,.35));
  }
  header h1{
    margin:0;
    font-size:clamp(24px,4vw,36px);
    font-weight:800;
    color:var(--gold);
    letter-spacing:.5px;
  }
  header p{
    margin:8px 0 0;
    color:var(--text-dim);
    font-size:15px;
  }
  header .stats{
    margin-top:18px;
    display:flex;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
    font-size:13px;
    color:var(--text-dim);
  }
  header .stats b{color:var(--gold);font-size:16px;display:block;}

  nav.cats{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(11,15,30,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:thin;
  }
  nav.cats a{
    flex:0 0 auto;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-size:13px;
    white-space:nowrap;
  }
  nav.cats a:hover{border-color:var(--gold-soft);color:var(--gold);}

  main{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}

  section.category{margin-bottom:44px;scroll-margin-top:60px;}
  section.category h2{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-size:19px;
    font-weight:700;
    color:var(--text);
    border-inline-start:3px solid var(--gold);
    padding-inline-start:12px;
    margin:0 0 16px;
  }
  section.category h2 .count{
    font-size:12px;
    font-weight:400;
    color:var(--text-dim);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:16px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:background .15s, transform .15s, border-color .15s;
  }
  .card:hover{background:var(--card-hover);border-color:var(--gold-soft);transform:translateY(-2px);}
  .card .thumb{
    position:relative;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
  }
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .thumb .play{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0);
    transition:background .15s;
  }
  .card:hover .thumb .play{background:rgba(0,0,0,.15);}
  .card .thumb .play svg{
    width:44px;height:44px;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
    opacity:.9;
  }
  .card .info{padding:10px 12px 12px;flex:1;}
  .card .info h3{
    margin:0;
    font-size:13.5px;
    font-weight:500;
    color:var(--text);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  footer{
    border-top:1px solid var(--border);
    padding:26px 20px 40px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
  }
  footer a{color:var(--gold);}
  footer a:hover{text-decoration:underline;}
  footer .sep{margin:0 8px;opacity:.4;}

  #empty{display:none;text-align:center;color:var(--text-dim);padding:60px 20px;}
  #loading{text-align:center;color:var(--text-dim);padding:60px 20px;}
</style>
</head>
<body>

<header>
  <span class="flame">🕯️</span>
  <h1>מכון להב מפיו יצא</h1>
  <p>ארכיון שיעורי תורה מפי הרב אבשלום שניידר</p>
  <div class="stats" id="stats"></div>
</header>

<nav class="cats" id="catNav"></nav>

<main>
  <div id="loading">טוען שיעורים…</div>
  <div id="empty">לא נמצאו שיעורים כרגע.</div>
  <div id="content"></div>
</main>

<footer>
  <a href="https://www.youtube.com/channel/UCyw-wgIrz5zswtMKn7Hyw6A" target="_blank" rel="noopener">הערוץ ביוטיוב</a>
  <span class="sep">·</span>
  <a href="https://github.com/7614415/video-dl-pub/releases/download/podcast/feed.xml">פודקאסט (RSS)</a>
</footer>

<script>
const PLAY_ICON = '<svg viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg"><path d="M66.5 7.7c-.8-2.9-2.5-5.2-5.4-6C55.8.2 34 .2 34 .2s-21.8 0-27.1 1.5c-2.9.8-4.6 3-5.4 6C.2 13 .2 24 .2 24s0 11 1.3 16.3c.8 2.9 2.5 5.1 5.4 6C12.2 47.8 34 47.8 34 47.8s21.8 0 27.1-1.5c2.9-.8 4.6-3 5.4-6C67.8 35 67.8 24 67.8 24s0-11-1.3-16.3z" fill="#c4a45a" opacity=".95"/><path d="M45 24 27 14v20z" fill="#0b0f1e"/></svg>';

fetch('data.json?_=' + Date.now())
  .then(r => r.json())
  .then(render)
  .catch(() => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('empty').style.display = 'block';
  });

function esc(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function render(data){
  document.getElementById('loading').style.display = 'none';
  const cats = (data.categories || []).filter(c => c.count > 0);
  if(!cats.length){
    document.getElementById('empty').style.display = 'block';
    return;
  }

  const totalVideos = cats.reduce((s,c) => s + c.count, 0);
  document.getElementById('stats').innerHTML =
    '<div><b>' + totalVideos + '</b>שיעורים</div>' +
    '<div><b>' + cats.length + '</b>נושאים</div>';

  const navEl = document.getElementById('catNav');
  const contentEl = document.getElementById('content');

  cats.forEach((cat, i) => {
    const slug = 'cat' + i;

    const navA = document.createElement('a');
    navA.href = '#' + slug;
    navA.textContent = cat.name;
    navEl.appendChild(navA);

    const section = document.createElement('section');
    section.className = 'category';
    section.id = slug;

    const h2 = document.createElement('h2');
    h2.innerHTML = esc(cat.name) + ' <span class="count">(' + cat.count + ')</span>';
    section.appendChild(h2);

    const grid = document.createElement('div');
    grid.className = 'grid';

    cat.videos.slice().reverse().forEach(v => {
      const a = document.createElement('a');
      a.href = 'https://youtu.be/' + v.id;
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'card';
      a.innerHTML =
        '<div class="thumb">' +
          '<img loading="lazy" src="' + esc(v.thumbnail) + '" alt="">' +
          '<div class="play">' + PLAY_ICON + '</div>' +
        '</div>' +
        '<div class="info"><h3>' + esc(v.title) + '</h3></div>';
      grid.appendChild(a);
    });

    section.appendChild(grid);
    contentEl.appendChild(section);
  });
}
</script>

</body>
</html>
