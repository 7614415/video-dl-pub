name: Scrape links from blocked pages

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "page URLs, newline or comma separated"
        required: true
      label:
        description: "artifact name suffix"
        required: false
        default: "links"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape
        run: |
          python tools/scrape_links.py --urls "${{ inputs.urls }}" --out out

      - name: Show report
        run: cat out/links.md

      - uses: actions/upload-artifact@v4
        with:
          name: links-${{ inputs.label }}
          path: out/
          retention-days: 7
