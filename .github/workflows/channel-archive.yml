name: Channel Archive (any channel -> Drive, IP-split matrix)
# Generic "download a whole channel into a Drive folder" pipeline.
# Why a matrix: YouTube bot-checks by IP after ~3 downloads (verified 2026-08-16),
# so instead of one runner doing N downloads we give every small chunk its own
# runner = its own exit IP. Resumable: dedup is against Drive, so re-running
# simply continues where the last run stopped.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel URL or @handle'
        required: true
        default: 'https://www.youtube.com/@Vocali'
      folder:
        description: 'Drive root folder name'
        required: true
        default: 'Vocali - יוטיוב'
      per_job:
        description: 'Videos per runner (each runner = fresh IP; >3 risks bot-block)'
        default: '3'
      chunks:
        description: 'Max chunks this run (total this run = chunks x per_job)'
        default: '20'
      quality:
        description: 'Max height (480/720/1080)'
        default: '720'

concurrency:
  group: channel-archive-${{ inputs.folder }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
      root: ${{ steps.d.outputs.root }}
      count: ${{ steps.d.outputs.count }}
      total: ${{ steps.d.outputs.total }}
      remaining: ${{ steps.d.outputs.remaining }}
    steps:
      - name: Enable WARP (bypass geo)
        uses: fscarmen/warp-on-actions@v1.1
        with:
          stack: dual
      - name: Install Deno (JS runtime required by yt-dlp for YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp
        run: pip install -q --upgrade yt-dlp
      - name: Enumerate channel + diff against Drive
        id: d
        env:
          CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          ROOT_NAME: ${{ inputs.folder }}
          PER_JOB: ${{ inputs.per_job }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          python3 << 'PYEOF'
          import urllib.request as R, urllib.parse as P, json, os, subprocess, sys, re

          if not (os.environ.get('CLIENT_ID') and os.environ.get('CLIENT_SECRET') and os.environ.get('REFRESH_TOKEN')):
              sys.stderr.write('::error::DRIVE_* secrets missing\n'); sys.exit(1)
          CH=os.environ['CHANNEL'].rstrip('/')
          if not CH.startswith('http'): CH='https://www.youtube.com/'+CH.lstrip('/')
          CH=re.sub(r'/(videos|streams|shorts|playlists|featured)$','',CH)
          ROOT_NAME=os.environ['ROOT_NAME']
          PER=max(1,int(os.environ.get('PER_JOB') or 3)); NCH=max(1,int(os.environ.get('CHUNKS') or 20))

          _td=P.urlencode({'client_id':os.environ['CLIENT_ID'],'client_secret':os.environ['CLIENT_SECRET'],
                           'refresh_token':os.environ['REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode()
          token=json.load(R.urlopen(R.Request('https://oauth2.googleapis.com/token',data=_td,method='POST')))['access_token']
          def api(u,m='GET',b=None):
              h={'Authorization':'Bearer '+token}
              if b is not None: h['Content-Type']='application/json'
              return json.load(R.urlopen(R.Request(u,data=(json.dumps(b).encode() if b is not None else None),headers=h,method=m),timeout=90))
          def qf(query,fields='files(id,name,mimeType)'):
              out,pg=[],None
              while True:
                  u='https://www.googleapis.com/drive/v3/files?q='+P.quote(query)+'&fields=nextPageToken,'+fields+'&pageSize=1000'
                  if pg:u+='&pageToken='+pg
                  r=api(u);out+=r.get('files',[]);pg=r.get('nextPageToken')
                  if not pg:break
              return out

          nm=ROOT_NAME.replace('\\','\\\\').replace("'","\\'")
          f=qf("name='"+nm+"' and mimeType='application/vnd.google-apps.folder' and trashed=false")
          root=f[0]['id'] if f else api('https://www.googleapis.com/drive/v3/files','POST',
                {'name':ROOT_NAME,'mimeType':'application/vnd.google-apps.folder'})['id']
          print('Drive root:',ROOT_NAME,root,flush=True)

          def norm(t):
              t=re.sub(r'\s*\[[\w-]{6,}\]\s*$','',t)
              t=re.sub(r'\.(mp4|mkv|webm|m4a|part|tmp)$','',t,flags=re.I)
              t=t.replace('｜','|').lower()
              t=re.sub(r'[^0-9a-z֐-׿]+',' ',t)
              return re.sub(r'\s+',' ',t).strip()

          # single-threaded scan on purpose: parallel Drive scans mis-count (2026-08-09 lesson)
          existing=set(); existing_titles=set()
          def scan(fid):
              for c in qf("'"+fid+"' in parents and trashed=false"):
                  if c['mimeType']=='application/vnd.google-apps.folder': scan(c['id'])
                  else:
                      n=c.get('name','')
                      m=re.search(r'\[([\w-]{6,})\]',n)
                      if m: existing.add(m.group(1))
                      k=norm(n)
                      if k: existing_titles.add(k)
          scan(root)
          print('Already in Drive:',len(existing),flush=True)

          def ytlist(url):
              r=subprocess.run(['yt-dlp','--flat-playlist','--print','%(id)s\t%(title)s',url],
                               capture_output=True,text=True,timeout=1200)
              return [l for l in r.stdout.split('\n') if '\t' in l], r.stderr

          # /videos alone is an unreliable subset -> union it with /streams, playlists and RSS.
          seen={}
          for tab in ('/videos','/streams','/playlists'):
              lst,err=ytlist(CH+tab)
              if tab=='/playlists':
                  for l in lst:
                      pid,pt=l.split('\t',1)
                      if not pid.startswith('PL'):
                          seen.setdefault(pid,pt); continue
                      subs,_=ytlist('https://www.youtube.com/playlist?list='+pid)
                      for s in subs:
                          v,t=s.split('\t',1); seen.setdefault(v,t)
              else:
                  for l in lst:
                      v,t=l.split('\t',1); seen.setdefault(v,t)
              print('  '+tab+': union now '+str(len(seen)),flush=True)
          try:
              cid=subprocess.run(['yt-dlp','--playlist-items','1','--print','%(channel_id)s',CH+'/videos'],
                                 capture_output=True,text=True,timeout=300).stdout.strip().split('\n')[0]
              if cid.startswith('UC'):
                  xml=R.urlopen('https://www.youtube.com/feeds/videos.xml?channel_id='+cid,timeout=60).read().decode()
                  for m in re.finditer(r'<entry>(.*?)</entry>',xml,re.S):
                      e=m.group(1)
                      seen.setdefault(re.search(r'<yt:videoId>([^<]+)',e).group(1),
                                      re.search(r'<title>(.*?)</title>',e,re.S).group(1))
                  print('  RSS('+cid+'): union now '+str(len(seen)),flush=True)
          except Exception as e:
              print('  RSS skipped:',str(e)[:120],flush=True)

          rows=list(seen.items())
          if not rows:
              sys.stderr.write('::error::0 videos enumerated - channel URL wrong or listing blocked\n'); sys.exit(1)
          new=[(v,t) for v,t in rows if v not in existing and norm(t) not in existing_titles]
          take=new[:PER*NCH]
          print('\nChannel total: %d | in Drive: %d | missing: %d | this run: %d'%(len(rows),len(existing),len(new),len(take)),flush=True)
          for v,t in take: print('   Q '+v+' :: '+t[:70],flush=True)

          mat=[{'i':i//PER,'ids':','.join(v for v,_ in take[i:i+PER])} for i in range(0,len(take),PER)]
          with open(os.environ['GITHUB_OUTPUT'],'a') as fh:
              fh.write('matrix='+json.dumps(mat)+'\n')
              fh.write('root=%s\ncount=%d\ntotal=%d\nremaining=%d\n'%(root,len(take),len(rows),len(new)))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as fh:
              fh.write('## %s\n- channel videos: **%d**\n- already in Drive: **%d**\n- missing: **%d**\n- queued this run: **%d** in %d runners\n'
                       %(ROOT_NAME,len(rows),len(existing),len(new),len(take),len(mat)))
          PYEOF

  download:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        chunk: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Enable WARP (fresh exit IP per runner)
        uses: fscarmen/warp-on-actions@v1.1
        with:
          stack: dual
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          pip install -q --upgrade yt-dlp
      - name: Download chunk -> Drive
        env:
          CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          IDS: ${{ matrix.chunk.ids }}
          ROOT: ${{ needs.discover.outputs.root }}
          MAXH: ${{ inputs.quality }}
        run: |
          python3 << 'PYEOF'
          import urllib.request as R, urllib.parse as P, json, os, subprocess, sys, time

          IDS=[x for x in os.environ['IDS'].split(',') if x]
          ROOT=os.environ['ROOT']; MAXH=int(os.environ.get('MAXH') or 720)
          _td=P.urlencode({'client_id':os.environ['CLIENT_ID'],'client_secret':os.environ['CLIENT_SECRET'],
                           'refresh_token':os.environ['REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode()
          def refresh(): return json.load(R.urlopen(R.Request('https://oauth2.googleapis.com/token',data=_td,method='POST')))['access_token']
          token=refresh()

          COMMON=['--no-playlist','--sleep-requests','1.5','--min-sleep-interval','2','--max-sleep-interval','7',
                  '--retries','6','--fragment-retries','12','--file-access-retries','4',
                  '-o','dl/%(title)s [%(id)s].%(ext)s']
          def dl(vid,clients):
              fmt='best[height<=%d]/bestvideo[height<=%d]+bestaudio/best'%(MAXH,MAXH)
              return subprocess.run(['yt-dlp','-f',fmt,'--merge-output-format','mp4',
                  '--extractor-args','youtube:player_client='+clients]+COMMON+
                  ['https://www.youtube.com/watch?v='+vid],capture_output=True,text=True,timeout=2400)
          os.makedirs('dl',exist_ok=True)
          done=0
          for vid in IDS:
              r=dl(vid,'default,tv,ios,web_safari')
              if r.returncode!=0:
                  time.sleep(8); r=dl(vid,'android,ios,mweb,tv')
              if r.returncode!=0:
                  print('DL FAIL '+vid+': '+r.stderr[-200:],flush=True); continue
              fl=[x for x in os.listdir('dl') if '['+vid+']' in x]
              if not fl:
                  print('NO FILE '+vid,flush=True); continue
              fn=fl[0]; path=os.path.join('dl',fn)
              with open(path,'rb') as fh: data=fh.read()
              token=refresh()
              bnd='----CA'; meta=json.dumps({'name':fn,'parents':[ROOT]}).encode()
              body=(('--'+bnd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n').encode()+meta+
                    ('\r\n--'+bnd+'\r\nContent-Type: video/mp4\r\n\r\n').encode()+data+('\r\n--'+bnd+'--\r\n').encode())
              try:
                  R.urlopen(R.Request('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
                      data=body,method='POST',headers={'Authorization':'Bearer '+token,
                      'Content-Type':'multipart/related; boundary='+bnd}),timeout=2400).read()
                  done+=1; print('OK '+fn[:60]+' (%dMB)'%(len(data)//1048576),flush=True)
              except Exception as e:
                  print('UP ERR '+fn[:40]+': '+str(e)[:150],flush=True)
              try: os.remove(path)
              except: pass
          print('chunk done %d/%d'%(done,len(IDS)))
          if done==0:
              sys.stderr.write('::error::0/%d downloaded - this exit IP is bot-checked. Re-run to get new IPs.\n'%len(IDS))
              sys.exit(1)
          PYEOF
