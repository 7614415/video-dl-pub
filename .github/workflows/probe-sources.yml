name: Survey free-media sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe
        run: python tools/probe_sources.py

      - uses: actions/upload-artifact@v4
        with:
          name: source-scan
          path: out/
          retention-days: 14
