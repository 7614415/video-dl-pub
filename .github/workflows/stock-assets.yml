name: Stock assets fetch (blocked sources -> artifact)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "archive | mixkit | urls"
        required: true
        default: "archive"
      query:
        description: "search query (archive/mixkit)"
        required: false
        default: ""
      count:
        description: "how many files"
        required: false
        default: "20"
      mediatype:
        description: "archive only: movies | audio"
        required: false
        default: "movies"
      kind:
        description: "mixkit only: audio | video"
        required: false
        default: "audio"
      urls:
        description: "urls source: newline separated direct links"
        required: false
        default: ""
      clip_seconds:
        description: "cap each video clip to N seconds (0 = keep full)"
        required: false
        default: "90"
      label:
        description: "artifact name suffix"
        required: false
        default: "batch"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch
        run: |
          python tools/stock_fetch.py \
            --source "${{ inputs.source }}" \
            --query "${{ inputs.query }}" \
            --count "${{ inputs.count }}" \
            --mediatype "${{ inputs.mediatype }}" \
            --kind "${{ inputs.kind }}" \
            --urls "${{ inputs.urls }}" \
            --out out

      - name: Shrink video before upload
        if: ${{ inputs.clip_seconds != '0' }}
        run: |
          # הרשת של המפעיל סורקת כל הורדה ומגבילה ל-~120KB/s.
          # ארטיפקט של 900MB = שעתיים. לכן מכווצים כאן, לא שם.
          shopt -s nullglob
          before=$(du -sm out | cut -f1)
          for f in out/*.mp4 out/*.m4v out/*.webm out/*.ogv; do
            [ -f "$f" ] || continue
            o="${f%.*}__c.mp4"
            ffmpeg -v error -y -t "${{ inputs.clip_seconds }}" -i "$f"               -vf "scale='min(1920,iw)':'min(1080,ih)':force_original_aspect_ratio=decrease,scale=trunc(iw/2)*2:trunc(ih/2)*2"               -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p               -c:a aac -b:a 128k -movflags +faststart "$o" && mv -f "$o" "${f%.*}.mp4"
            [ "$f" != "${f%.*}.mp4" ] && rm -f "$f"
          done
          after=$(du -sm out | cut -f1)
          echo "shrink: ${before}MB -> ${after}MB"

      - name: Listing
        run: |
          ls -lh out | head -60
          du -sh out

      - uses: actions/upload-artifact@v4
        with:
          name: stock-${{ inputs.label }}
          path: out/
          retention-days: 7
          compression-level: 0
