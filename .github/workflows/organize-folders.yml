name: Organize Drive folder into subfolders (by playlist / title)
# Sorts an already-downloaded channel folder into content subfolders.
# Moving = files.update addParents/removeParents. NEVER trash to reorganize:
# a Drive file can have several parents, so trashing removes it everywhere
# (2026-08-09 lesson - 181 videos were lost that way and had to be restored).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel URL or @handle (source of the playlist map)'
        required: true
        default: 'https://www.youtube.com/@Vocali'
      folder:
        description: 'Drive folder name to organize'
        required: true
        default: 'Vocali - יוטיוב'
      apply:
        description: 'yes = actually move files, no = dry run'
        default: 'no'

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Enable WARP
        uses: fscarmen/warp-on-actions@v1.1
        with:
          stack: dual
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp
        run: pip install -q --upgrade yt-dlp
      - name: Map videos to playlists and move
        env:
          CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          ROOT_NAME: ${{ inputs.folder }}
          APPLY: ${{ inputs.apply }}
        run: |
          python3 << 'PYEOF'
          import urllib.request as R, urllib.parse as P, json, os, subprocess, sys, re

          CH=os.environ['CHANNEL'].rstrip('/')
          if not CH.startswith('http'): CH='https://www.youtube.com/'+CH.lstrip('/')
          CH=re.sub(r'/(videos|streams|shorts|playlists|featured)$','',CH)
          ROOT_NAME=os.environ['ROOT_NAME']; APPLY=(os.environ.get('APPLY','no').lower()=='yes')

          _td=P.urlencode({'client_id':os.environ['CLIENT_ID'],'client_secret':os.environ['CLIENT_SECRET'],
                           'refresh_token':os.environ['REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode()
          def refresh(): return json.load(R.urlopen(R.Request('https://oauth2.googleapis.com/token',data=_td,method='POST')))['access_token']
          token=refresh()
          def api(u,m='GET',b=None):
              h={'Authorization':'Bearer '+token}
              if b is not None: h['Content-Type']='application/json'
              return json.load(R.urlopen(R.Request(u,data=(json.dumps(b).encode() if b is not None else None),headers=h,method=m),timeout=90))
          def qf(query,fields='files(id,name,mimeType,parents)'):
              out,pg=[],None
              while True:
                  u='https://www.googleapis.com/drive/v3/files?q='+P.quote(query)+'&fields=nextPageToken,'+fields+'&pageSize=1000'
                  if pg:u+='&pageToken='+pg
                  r=api(u);out+=r.get('files',[]);pg=r.get('nextPageToken')
                  if not pg:break
              return out
          def ensure(parent,name):
              nm=name.replace('\\','\\\\').replace("'","\\'")
              r=qf("name='"+nm+"' and '"+parent+"' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false")
              if r: return r[0]['id']
              return api('https://www.googleapis.com/drive/v3/files','POST',
                         {'name':name,'mimeType':'application/vnd.google-apps.folder','parents':[parent]})['id']

          nm=ROOT_NAME.replace('\\','\\\\').replace("'","\\'")
          f=qf("name='"+nm+"' and mimeType='application/vnd.google-apps.folder' and trashed=false")
          if not f: sys.stderr.write('::error::folder not found: '+ROOT_NAME+'\n'); sys.exit(1)
          root=f[0]['id']; print('Root:',ROOT_NAME,root,flush=True)

          def ytlist(url):
              r=subprocess.run(['yt-dlp','--flat-playlist','--print','%(id)s\t%(title)s',url],
                               capture_output=True,text=True,timeout=1200)
              return [l for l in r.stdout.split('\n') if '\t' in l]

          def clean(s):
              s=s.replace('｜','|')
              s=re.sub(r'[\\/:*?"<>|]',' ',s)
              return re.sub(r'\s+',' ',s).strip()[:70]

          vid2cat={}
          for l in ytlist(CH+'/playlists'):
              pid,pt=l.split('\t',1)
              if not pid.startswith('PL'): continue
              cat=clean(pt) or 'כללי'
              for s in ytlist('https://www.youtube.com/playlist?list='+pid):
                  v,_t=s.split('\t',1); vid2cat.setdefault(v,cat)
          print('playlist map:',len(vid2cat),'videos in',len(set(vid2cat.values())),'playlists',flush=True)

          # fallback for videos in no playlist: the title segment before '#' / '|' / ' - '
          def cat_from_title(t):
              t=t.replace('｜','|')
              t=re.sub(r'\s*\[[\w-]{6,}\]\s*$','',t)
              t=re.sub(r'\.(mp4|mkv|webm)$','',t,flags=re.I)
              s=re.split(r'[|]|\s-\s|#',t)[0]
              s=clean(s)
              return s if len(s)>=3 else 'כללי'

          files=[x for x in qf("'"+root+"' in parents and trashed=false")
                 if x['mimeType']!='application/vnd.google-apps.folder']
          print('files in root:',len(files),flush=True)

          plan={}
          for x in files:
              m=re.search(r'\[([\w-]{6,})\]',x['name'])
              cat=vid2cat.get(m.group(1)) if m else None
              if not cat: cat=cat_from_title(x['name'])
              plan.setdefault(cat,[]).append(x)

          # a category holding a single file is noise -> fold it into כללי
          for cat in [c for c,v in plan.items() if len(v)==1 and c!='כללי']:
              plan.setdefault('כללי',[]).extend(plan.pop(cat))

          for cat in sorted(plan): print('  %-45s %d'%(cat,len(plan[cat])),flush=True)
          if not APPLY:
              print('\nDRY RUN - re-run with apply=yes to move.'); sys.exit(0)

          moved=0
          for cat,items in sorted(plan.items()):
              sub=ensure(root,cat)
              for i,x in enumerate(items):
                  if moved and moved%40==0: token=refresh()
                  try:
                      api('https://www.googleapis.com/drive/v3/files/'+x['id']
                          +'?addParents='+sub+'&removeParents='+root+'&fields=id','PATCH',{})
                      moved+=1
                  except Exception as e:
                      print('MOVE ERR',x['name'][:40],str(e)[:100],flush=True)
              print('moved into',cat,flush=True)
          print('\nDone: %d files moved into %d folders.'%(moved,len(plan)))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as fh:
              fh.write('## organize %s\nmoved **%d** files into **%d** folders\n\n'%(ROOT_NAME,moved,len(plan)))
              for cat in sorted(plan): fh.write('- %s: %d\n'%(cat,len(plan[cat])))
          PYEOF
