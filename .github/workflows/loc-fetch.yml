name: Library of Congress fetch (-> Drive + proxy)

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "comma separated search terms"
        required: true
        default: "world war two,holocaust"
      per:
        description: "items per query"
        required: false
        default: "15"
      kind:
        description: "film-and-videos | photos | audio"
        required: false
        default: "film-and-videos"
      max_mb:
        description: "skip source files larger than this"
        required: false
        default: "250"
      clip_seconds:
        description: "cap each clip to N seconds (0 = keep full)"
        required: false
        default: "180"
      proxy_height:
        description: "low-res proxy height for local editing (0 = off)"
        required: false
        default: "480"
      drive_folder:
        description: "Drive folder name"
        required: false
        default: "loc-footage"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      # Inputs travel via env, never interpolated into the shell: a query
      # containing quotes tore the command apart once already.
      - name: Fetch
        env:
          QUERIES: ${{ inputs.queries }}
          PER: ${{ inputs.per }}
          KIND: ${{ inputs.kind }}
          MAXMB: ${{ inputs.max_mb }}
        run: |
          python tools/loc_fetch.py \
            --queries "$QUERIES" --per "$PER" --kind "$KIND" \
            --max-mb "$MAXMB" --out out

      - name: Normalise
        if: ${{ inputs.clip_seconds != '0' }}
        env:
          SECS: ${{ inputs.clip_seconds }}
        run: |
          set -uo pipefail
          ok=0; bad=0
          while IFS= read -r f; do
            tmp="${f%.*}__c.mp4"
            if ffmpeg -v error -y -t "$SECS" -i "$f" \
                 -vf "scale='min(1920,iw)':'min(1080,ih)':force_original_aspect_ratio=decrease,scale=trunc(iw/2)*2:trunc(ih/2)*2" \
                 -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p \
                 -c:a aac -b:a 128k -movflags +faststart "$tmp"; then
              rm -f "$f"; mv -f "$tmp" "${f%.*}.mp4"; ok=$((ok+1))
            else
              rm -f "$tmp"; bad=$((bad+1)); echo "::warning::transcode failed: $f"
            fi
          done < <(find out -type f \( -name '*.mp4' -o -name '*.mov' -o -name '*.m4v' -o -name '*.mpg' -o -name '*.mpeg' -o -name '*.avi' -o -name '*.webm' \))
          echo "normalise ok=$ok failed=$bad"
          if [ "$ok" -eq 0 ] && [ "$bad" -gt 0 ]; then echo "::error::all transcodes failed"; exit 1; fi

      - name: Build proxies
        if: ${{ inputs.proxy_height != '0' }}
        env:
          PH: ${{ inputs.proxy_height }}
        run: |
          set -uo pipefail
          mkdir -p proxy
          ok=0
          while IFS= read -r f; do
            rel="${f#out/}"; o="proxy/${rel%.*}.mp4"; mkdir -p "$(dirname "$o")"
            ffmpeg -v error -y -t 60 -i "$f" -vf "scale=-2:$PH" \
              -c:v libx264 -preset veryfast -crf 32 -pix_fmt yuv420p \
              -c:a aac -b:a 64k -ac 1 -movflags +faststart "$o" && ok=$((ok+1)) || rm -f "$o"
          done < <(find out -type f -name '*.mp4')
          cp out/MANIFEST.json proxy/ 2>/dev/null || true
          echo "proxies=$ok size=$(du -sh proxy | cut -f1)"

      - name: Listing
        run: |
          find out -type f | wc -l
          du -sh out

      - name: Upload to Drive
        env:
          CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          FOLDER: ${{ inputs.drive_folder }}
        run: python tools/drive_up.py out "$FOLDER"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.proxy_height != '0' }}
        with:
          name: proxy-loc
          path: proxy/
          retention-days: 7
          compression-level: 0
