                  subprocess.run(["ffmpeg", "-y", "-v", "error", "-i", "full.mp4", "-vf", "scale=1280:720," + GRADE,
                                  "-an", "-c:v", "libx264", "-preset", "fast", "-crf", "23", "-pix_fmt", "yuv420p", "graded.mp4"], check=True, timeout=180)
                  dur = float(subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration",
                                               "-of", "csv=p=0", "graded.mp4"], capture_output=True, text=True, check=True).stdout.strip())
                  x = 1.5
                  filt = (
