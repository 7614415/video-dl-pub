                      "[0:v]trim=start=%.3f:end=%.3f,setpts=PTS-STARTPTS[vend];"
                      "[vend][vstart]xfade=transition=fade:duration=%.3f:offset=0[xf];"
                      "[0:v]trim=start=%.3f:end=%.3f,setpts=PTS-STARTPTS[mid];"
                      "[xf][mid]concat=n=2:v=1:a=0[outv]"
                  ) % (x, dur - x, dur, x, x, dur - x)
                  subprocess.run(["ffmpeg", "-y", "-v", "error", "-i", "graded.mp4", "-filter_complex", filt,
                                  "-map", "[outv]", "-c:v", "libx264", "-preset", "fast", "-pix_fmt", "yuv420p", "seamless.mp4"], check=True, timeout=180)
                  upload_to_drive("seamless.mp4", style + ".mp4", style_folder_id)
