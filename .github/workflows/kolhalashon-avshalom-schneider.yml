          q = "name='%s' and mimeType='application/vnd.google-apps.folder' and trashed=false" % ROOT_FOLDER_NAME
          root_id = drive_get("https://www.googleapis.com/drive/v3/files?q=" + urllib.parse.quote(q) + "&fields=files(id,name)")["files"][0]["id"]

          NAME = "_רקע_קבוע_ללולאה.mp4"
          q2 = "name='%s' and trashed=false and '%s' in parents" % (NAME, root_id)
          existing = drive_get("https://www.googleapis.com/drive/v3/files?q=" + urllib.parse.quote(q2) + "&fields=files(id,name)")
          old_id = existing["files"][0]["id"] if existing.get("files") else None

          size = os.path.getsize("seamless.mp4")
          if old_id:
              meta_url = "https://www.googleapis.com/upload/drive/v3/files/%s?uploadType=resumable" % old_id
              method_meta = "PATCH"
          else:
              meta_url = "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable"
              method_meta = "POST"
          meta = json.dumps({"name": NAME} if old_id else {"name": NAME, "parents": [root_id]}).encode()
          req = urllib.request.Request(meta_url, meta, {
              "Authorization": "Bearer " + DT, "Content-Type": "application/json; charset=UTF-8",
              "X-Upload-Content-Type": "video/mp4", "X-Upload-Content-Length": str(size)}, method=method_meta)
          sess = urllib.request.urlopen(req, timeout=120).headers["Location"]
          CH = 8 << 20
          sent = 0
          with open("seamless.mp4", "rb") as fh:
              while sent < size:
                  data = fh.read(CH)
                  end = sent + len(data) - 1
                  put = urllib.request.Request(sess, data, method="PUT")
                  put.add_header("Content-Range", "bytes %d-%d/%d" % (sent, end, size))
                  try:
                      resp = urllib.request.urlopen(put, timeout=300)
                      json.load(resp)
                      sent = size
                  except urllib.error.HTTPError as e:
                      if e.code != 308:
                          raise
                      sent = end + 1
          print("uploaded full-res seamless bg to Drive, replacing old:", bool(old_id))
          PY

  fetch_full_bg_multi:
