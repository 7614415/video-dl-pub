name: List playlist video IDs (no download)
on:
  workflow_dispatch:
    inputs:
      playlists:
        description: 'Playlist URLs, one per line or comma separated'
        required: true

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enable WARP
        uses: fscarmen/warp-on-actions@v1.1
        with:
          stack: dual
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp
        run: pip install -q --upgrade yt-dlp
      - name: List
        env:
          PLAYLISTS: ${{ inputs.playlists }}
        run: |
          python3 << 'PYEOF'
          import os, re, subprocess
          urls = [u for u in re.split(r'[,\n]+', os.environ['PLAYLISTS']) if u.strip()]
          for url in urls:
              url = url.strip()
              print(f"\n=== {url} ===", flush=True)
              r = subprocess.run(['yt-dlp', '--flat-playlist', '--print', '%(id)s :: %(title)s', url],
                                  capture_output=True, text=True, timeout=120)
              print(r.stdout)
              if r.returncode != 0:
                  print("ERR:", r.stderr[-500:])
          PYEOF
